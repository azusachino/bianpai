name: multi-host

services:
  web:
    image: mirror.gcr.io/library/python:3.12-alpine
    working_dir: /app
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    ports:
      - "8082:8000"
    volumes:
      - ./shared-data:/srv

  caddy:
    image: mirror.gcr.io/library/caddy:2-alpine
    ports:
      - "8083:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./shared-data:/srv
    depends_on:
      - web

  build-test:
    build:
      context: .
      dockerfile: Containerfile
    image: local-build-test:latest
    command: ["sleep", "1000"]
