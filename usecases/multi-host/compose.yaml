name: multi-host

services:
  web:
    image: mirror.gcr.io/library/python:3.12-alpine
    working_dir: /app
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    ports:
      - "8082:8000"

  caddy:
    image: mirror.gcr.io/library/caddy:2-alpine
    ports:
      - "8083:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
