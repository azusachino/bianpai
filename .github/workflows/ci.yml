name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make check
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - run: make quality
